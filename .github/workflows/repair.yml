name: Motion repair proposal
on:
  workflow_run:
    workflows: [Motion CI]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: motion-repair
  cancel-in-progress: false
jobs:
  propose:
    if: >-
      vars.MOTION_REPAIR_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: motion-ci-log
          path: .repair
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Propose one bounded repair
        run: node scripts/repair-generate.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPAIR_MODEL: ${{ vars.REPAIR_MODEL }}
      - uses: actions/upload-artifact@v4
        with:
          name: repair-candidate
          path: .repair/candidate.json
          retention-days: 7
  verify:
    needs: propose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: repair-candidate
          path: .repair
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/repair-apply.mjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck && npm test && npm run build && npm run test:e2e
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: repair-candidate
          path: .repair
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate scope without executing candidate code
        run: node scripts/repair-apply.mjs
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const candidate = JSON.parse(fs.readFileSync('.repair/candidate.json', 'utf8'));
            const {owner, repo} = context.repo;
            const base = context.payload.workflow_run.head_sha;
            const current = await github.rest.git.getRef({owner,repo,ref:'heads/main'});
            if (current.data.object.sha !== base) throw new Error('Main changed; a fresh CI run must evaluate it.');
            const branch = 'motion-repair/' + context.payload.workflow_run.id;
            const commit = await github.rest.git.getCommit({owner,repo,commit_sha:base});
            const tree = await github.rest.git.createTree({owner,repo,base_tree:commit.data.tree.sha,tree:candidate.files.map(f=>({path:f.path,mode:'100644',type:'blob',content:f.content}))});
            const created = await github.rest.git.createCommit({owner,repo,message:'fix: propose verified Motion repair',tree:tree.data.sha,parents:[base]});
            await github.rest.git.createRef({owner,repo,ref:'refs/heads/'+branch,sha:created.data.sha});
            await github.rest.pulls.create({owner,repo,head:branch,base:'main',draft:true,title:'Motion: tested repair proposal',body:'A bounded agent proposed this change after CI failed. Type checks, unit/privacy tests, production build and browser journeys passed on the candidate.\n\n'+candidate.summary.slice(0,4000)+'\n\nHuman review is required. This workflow does not merge or deploy.'});
