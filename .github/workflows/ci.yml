name: Motion CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify
        shell: bash
        run: |
          set -o pipefail
          { npm run typecheck && npm test && npm run build && npm run test:e2e; } 2>&1 | tee ci.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: motion-ci-log
          path: ci.log
          retention-days: 7
